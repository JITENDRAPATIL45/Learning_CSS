<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Z Index</title>
        <style>
            .container{
                position: relative;
                margin: 50px;
            }
            div{
                width: 150px;
                height: 150px;
                border-radius: 50%;
                position: absolute;
            }
            .blue{
                background-color: blue;
                left: 40px;
                z-index: 5;
            }
            .red{
                background-color: red;
                left: 80px;
                z-index: 10;
            }
            .green{
                background-color: green;
                z-index: 4;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="blue"></div>
            <div class="red"></div>
            <div class="green"></div>
        </div>
    </body>
</html>
