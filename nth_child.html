<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <style>
        ul{
            width: 200px;
            padding: 15px;
            list-style: none;
            font-weight: 900;

        }
        li{
            padding: 10px;
            border: 2px double red;
            margin-bottom: 5px;
            border-radius: 10px;
        }
        /* li:nth-child(even){
            background-color: aqua;
        }
        li:nth-child(odd){
            background-color: yellowgreen;
        } */

        li:first-child{
            background-color: aqua;
        }
        li:nth-child(5){
            background-color: blue;
        }
        li:nth-child(3){
            background-color: rgb(71, 71, 120);
        }
        li:last-child{
            background-color: brown;
        }
    </style>
    </head>
    <body>

        <ul>
            <li>item 1</li>
            <li>item 2</li>
            <li>item 3</li>
            <li>item 4</li>
            <li>item 5</li>
            <li>item 6</li>
            <li>item 7</li>
            <li>item 8</li>
        </ul>
    </body>
</html>
