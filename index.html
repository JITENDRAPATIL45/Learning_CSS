<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>index</title>
        <style>
            h2{
                color: aqua;
                background-color: rgb(12, 14, 17);
                font-size: 90px;
            }
            h1{
                color: black !important;
                background-color: blue !important;
                font-size: 60px;
            }
        </style>
        <link rel="stylesheet" href="css/style.css" type="text/css">
    </head>
    <body>
        <!-- external css -->
        <h3>hello</h3>
        <!-- internal css -->
        <h2>hello world</h2>
        <h2>hello world </h2>
        <!-- inline css start -->
        <h1 style="color: aqua; background-color: black; font-size: 60px;">Day 1
            of CSS </h1>
        <h1 style="color: blue; background-color: rgb(83, 243, 243);">hello
        </h1>
        <h1>hiii this my web site</h1>

    </body>
</html>
