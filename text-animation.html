<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Text Animation</title>
        <style>
            .t_container{
                display: flex;
                justify-content: center;
                font-family: cursive;
                font-size: 70px;
                font-weight: 900;
                letter-spacing: 4px;
                perspective: 120px;
            }

            .t_container > b{
                height: 90px;
                box-shadow: 0px 15px 5px gray;
                background: linear-gradient(to right, red, green, blue, yellow);
                background-clip: text;
                color: transparent;
                transform-origin: bottom;
                animation: getUpDown 10s infinite;
            }

            .t_container > b:nth-child(1){ animation-delay: 0s; } 

            .t_container > b:nth-child(2){ animation-delay: 0.25s; }

            .t_container > b:nth-child(3){ animation-delay: 0.50s; }

            .t_container > b:nth-child(4){ animation-delay: 0.75s; }

            .t_container > b:nth-child(5){ animation-delay: 1s; }

            .t_container > b:nth-child(6){ animation-delay: 1.25s; }

            .t_container > b:nth-child(7){ animation-delay: 1.50s; }

            .t_container > b:nth-child(8){  animation-delay: 1.75s; }

            @keyframes getUpDown{
                from{
                    transform: rotateX(-90deg);
                }
                10%,50%{
                    transform: rotateX(0deg);
                }
                60%,to{
                    transform: rotateX(-90deg);
                }
            }
        </style>
    </head>
    <body>
        <div class="t_container">
            <b>J</b> <b>I</b> <b>T</b> <b>E</b> <b>N</b> <b>D</b> <b>R</b> <b>A</b>
        </div>
    </body>
</html>
